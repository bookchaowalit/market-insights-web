# GitHub Pages deploy (owner decision D-MIW-1, ADR-0003/D3): publish main only after CI passed on
# it, only the site files, fixtures-only, then smoke-check the live site for the deployed commit.
# Replaces the legacy "deploy from branch" build (Pages source: GitHub Actions).
name: Pages deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build the Pages artifact (fixtures only, commit marker)
        id: build
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Optional: the browser DSN of Sentry project market-insights-web, never committed.
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          node --experimental-strip-types scripts/build-pages.ts _site "$COMMIT" "$SENTRY_DSN"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-smoke:
    name: Production smoke (bookchaowalit.github.io/market-insights-web)
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Smoke-check the live site
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.commit }}
        run: bash scripts/deploy-smoke.sh https://bookchaowalit.github.io/market-insights-web "$EXPECTED_SHA"
