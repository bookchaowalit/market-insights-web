# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22" # engines: node >=22.6
      require-tests: true # ADR-0004: fail if the test script disappears
      # Biome lint/format, typecheck and npm test run by default. Kept from the previous
      # workflow: the committed browser bundle must match src/, and the static scripts must parse.
      build-command: |
        npm run check:browser
        node --check js/data-products-browser.js
        node --check scripts/verify-browser-consumers.mjs

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
